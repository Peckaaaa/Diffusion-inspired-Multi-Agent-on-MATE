# Discrete categorical diffusion world model on MATE.
# Override any leaf from the command line: python train.py --set policy.horizon=12

env:
  # Resolved against MATE-main/mate/assets (MATE_ROOT overrides the checkout).
  scenario: MATE-4v8-9
  max_episode_steps: 200      # MATE steps per episode
  # frame_skip 5 was tried and reverted: same coverage ceiling (0.4035 vs 0.4068)
  # but reached at 250k steps instead of 50k, because a 5-step jump widens the
  # dynamics gap the diffusion has to cross and spreads the same number of
  # transitions over five times the state space.
  frame_skip: 1
  msg_dim: 8
  camera_comm: true
  reward_scale: 1.0
  seed: 0

world_model:
  levels: [8, 8, 8]        # FSQ grid -> 8*8*8 = 512 classes per token
  num_tokens: 16           
  ae_hidden: 512
  tf_hidden: 256
  tf_layers: 4
  tf_heads: 8
  reward_seq_len: 8        # Window length for the minGPT reward/termination backbone
  lr: 3.0e-4               # Autoencoder holds this; diffusion and reward anneal to lr_min
  lr_min: 3.0e-5
  grad_clip: 1.0

diffusion:
  num_steps: 20            # T_diff used during training
  sample_steps: 6          # Accelerated reverse process at rollout time
  noise_type: absorbing    # Absorbing (mask token) | uniform (transition matrix)
  schedule: cosine         # Cosine | linear
  sample_temperature: 1.0  # 0 turns the reverse process into argmax decoding

policy:
  hidden_dim: 256
  actor_lr: 3.0e-4              
  critic_lr: 5.0e-4
  clip_ratio: 0.2
  entropy_coef: 4.5e-3
  entropy_coef_min: 3.0e-4
  entropy_decay_steps: 60000
  value_coef: 0.5
  max_grad_norm: 0.5
  gamma: 0.99
  lam: 0.95
  horizon: 16                   
  ppo_epochs: 5
  num_minibatches: 4
  target_kl: 0.015              # Stop the remaining epochs once an epoch moves this far; 0 disables

train:
  # Every step budget below counts MATE steps, not decisions, so it stays
  # comparable with the paper's 10M-step axis across frame-skip settings.
  total_env_steps: 150000
  seed_steps: 10000
  env_steps_per_iter: 1000
  wm_updates_per_iter: 250
  policy_updates_per_iter: 20   # [TĂNG GẤP ĐÔI] Ép Policy khai thác triệt để mô hình thế giới
  wm_batch_size: 256
  imagine_batch_size: 256
  buffer_capacity: 500000
  eval_every: 10
  eval_episodes: 30             # std was 0.03-0.08 at 10; the gains being chased are 0.10-0.20
  save_dir: runs/categorical_diffusion_aggressive
  device: auto
  wandb: true